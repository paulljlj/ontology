services:
  postgres:
    image: postgres:16-alpine
    container_name: ontology-ai-postgres
    environment:
      POSTGRES_DB: ontology_ai
      POSTGRES_USER: ontology
      POSTGRES_PASSWORD: ontology
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontology -d ontology_ai"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: ontology-ai-backend
    environment:
      DATABASE_URL: postgresql+psycopg://ontology:ontology@postgres:5432/ontology_ai
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ontology
      NEO4J_MCP_URI: bolt://neo4j:7687
      NEO4J_MCP_USERNAME: neo4j
      NEO4J_MCP_PASSWORD: ontology
      NEO4J_MCP_DATABASE: ontology
      NEO4J_MCP_BIN: /usr/local/bin/neo4j-mcp-server
      SATELLITE_DATA_ROOT: /workspace-data/satellite_demo_v1
      SATELLITE_ARTIFACT_ROOT: /app/report_artifacts/satellite
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data-output:/workspace-data:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  neo4j:
    image: neo4j:5.26-community
    container_name: ontology-ai-neo4j
    environment:
      NEO4J_AUTH: neo4j/ontology
      # Required by the official Neo4j MCP server for schema discovery.
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_default__database: ontology
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
